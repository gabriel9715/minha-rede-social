<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Rede Social</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Barra Superior -->
    <header class="navbar">
        <div class="logo">RedeSocial<span>.dev</span></div>
        <div class="nav-controls">
            <button class="btn-theme" onclick="alternarTema()" id="themeBtn">🌙 Modo Escuro</button>
            <div class="user-status" id="userStatus">
                <span>Visitante</span>
            </div>
        </div>
    </header>

    <div class="container">
        
        <!-- Coluna Esquerda: Login / Meu Perfil -->
        <aside class="auth-section">
            <!-- Painel de Login/Cadastro (quando deslogado) -->
            <div class="card" id="authBox">
                <h3 id="authTitle">Entrar na Conta</h3>
                <input type="text" id="authNome" placeholder="Seu nome" style="display: none;">
                <input type="email" id="authEmail" placeholder="Seu e-mail">
                <input type="password" id="authSenha" placeholder="Sua senha">
                <button id="authBtn" onclick="executarAutenticacao()">Entrar</button>
                <p class="toggle-link">
                    <span id="toggleText">Não tem conta?</span>
                    <a href="javascript:void(0)" onclick="alternarModoAuth()">Cadastre-se</a>
                </p>
            </div>

            <!-- Painel do Meu Perfil (quando logado) -->
            <div class="card" id="profileBox" style="display: none;">
                <div class="profile-preview">
                    <img id="myAvatarImg" src="https://via.placeholder.com/150/1877f2/ffffff?text=Perfil" alt="Avatar" class="avatar-large">
                    <h3 id="profileName">Nome</h3>
                    <p id="profileBio" class="bio-text">Sem biografia.</p>
                </div>

                <!-- Abas Rápidas: Feed Geral vs Salvos -->
                <div class="profile-tabs">
                    <button id="tabFeedBtn" class="tab-btn active" onclick="trocarAbaFeed('todos')">🌐 Feed</button>
                    <button id="tabSalvosBtn" class="tab-btn" onclick="trocarAbaFeed('salvos')">🔖 Salvos</button>
                </div>

                <hr class="divider">
                <h4>Editar Perfil</h4>
                
                <label class="btn-upload-label" for="fileFoto">
                    📷 Escolher Foto do Aparelho
                </label>
                <input type="file" id="fileFoto" accept="image/*" style="display: none;" onchange="previsualizarFoto(event)">

                <textarea id="editBio" placeholder="Escreva sua biografia..." maxlength="120"></textarea>
                <button class="btn-save-profile" onclick="salvarPerfil()">Salvar Perfil</button>
                <button class="btn-logout" onclick="deslogar()">Sair da Conta</button>
            </div>
        </aside>

        <!-- Coluna Principal: Feed -->
        <main class="feed-section">
            
            <!-- Criar Post (Só visível na aba 'todos') -->
            <div class="card create-post" id="boxCriarPost">
                <textarea id="postContent" placeholder="O que você quer compartilhar hoje?"></textarea>
                <div class="post-actions">
                    <button class="btn-primary" onclick="criarPost()">Publicar</button>
                </div>
            </div>

            <!-- Título da visualização atual -->
            <h3 id="feedTitle" style="margin-bottom: 15px; font-size: 1.1rem; color: var(--text-muted);">Feed Recente</h3>

            <!-- Feed de Publicações -->
            <section id="feed" class="feed">
                <!-- Posts entram aqui via script.js -->
            </section>

        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
